spring.application.name=sms
spring.datasource.url=jdbc:postgresql://localhost:5432/sms
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update

# Expose specific endpoints (use "*" only during local development)
management.endpoints.web.exposure.include=health,info,metrics,beans,env

# Show full database and disk health details instead of just {"status": "UP"}
management.endpoint.health.show-details=always

# Add custom app info to /actuator/info
management.info.env.enabled=true
info.app.name=Student Management System
info.app.version=1.0.0
